<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: one phone-width column (max 560px), a fixed tab bar at the bottom, focus views (les, vragen, examen) without the tab bar. */
:root{
  --bg:#ECEFE5; --surface:#FAFBF6; --surface-2:#E0E5D6; --ink:#17231B; --ink-2:#56645A; --line:#C9D1C0;
  --green:#2F5D3F; --green-soft:#D3E2D2; --accent:#D2470F; --accent-ink:#FFFFFF;
  --good:#256E37; --good-bg:#D6ECD9; --bad:#AE241C; --bad-bg:#F5D9D6; --warn:#875A00; --warn-bg:#F3E5BF;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --vak1:#3D5A7A; --vak1-soft:#DCE4EE; --vak2:#4D7A35; --vak2-soft:#DFEAD3; --vak3:#A4621F; --vak3-soft:#F1E2CF;
  --band:#22432E; --band-2:#2F5D3F; --band-ink:#F2F5EC; --band-mute:#B9C9B7;
  --r:16px; --shadow:0 1px 2px rgba(23,35,27,.06),0 4px 14px rgba(23,35,27,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1612; --surface:#17211B; --surface-2:#202D25; --ink:#E6ECE1; --ink-2:#9DAA9F; --line:#2D3B32;
  --green:#82B88F; --green-soft:#21372A; --accent:#FF7A3D; --accent-ink:#1C0D04;
  --good:#6FC585; --good-bg:#1A3922; --bad:#FF8E84; --bad-bg:#45201D; --warn:#E5B648; --warn-bg:#3A2F12;
  --vak1:#8FB0D6; --vak1-soft:#1E2A38; --vak2:#9CCB7E; --vak2-soft:#1F2F19; --vak3:#E3A665; --vak3-soft:#36271A;
  --band:#132A1C; --band-2:#1C3A27; --band-ink:#E9F0E4; --band-mute:#97AD98; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F1612; --surface:#17211B; --surface-2:#202D25; --ink:#E6ECE1; --ink-2:#9DAA9F; --line:#2D3B32;
  --green:#82B88F; --green-soft:#21372A; --accent:#FF7A3D; --accent-ink:#1C0D04;
  --good:#6FC585; --good-bg:#1A3922; --bad:#FF8E84; --bad-bg:#45201D; --warn:#E5B648; --warn-bg:#3A2F12;
  --vak1:#8FB0D6; --vak1-soft:#1E2A38; --vak2:#9CCB7E; --vak2-soft:#1F2F19; --vak3:#E3A665; --vak3-soft:#36271A;
  --band:#132A1C; --band-2:#1C3A27; --band-ink:#E9F0E4; --band-mute:#97AD98; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }

*{box-sizing:border-box}
html{height:100%;background:var(--surface)}
html.ios-app{padding-top:max(env(safe-area-inset-top,0px),50px)!important;background:var(--bg)}
body{height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
#scroller{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;background:var(--bg)}
#app{max-width:560px;margin:0 auto;padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;min-height:60vh}
#app.focus{padding-block:14px 40px}
h1,h2,h3,p,ul,ol,figure{margin:0}
h1{font-family:var(--display);font-weight:700;font-size:2.1rem;line-height:1.05;letter-spacing:.005em;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:1.45rem;line-height:1.15;text-wrap:balance}
h3{font-family:var(--body);font-weight:600;font-size:1rem;line-height:1.3}
.eyebrow{font-family:var(--display);font-weight:600;font-size:.85rem;letter-spacing:.09em;text-transform:uppercase;color:var(--green)}
.muted{color:var(--ink-2)} .small{font-size:.875rem} .num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--green)}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:44px;height:44px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}
.back{border:0;background:none;padding:8px 0;font-weight:600;color:var(--green);display:inline-flex;align-items:center;gap:6px;align-self:flex-start;min-height:44px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:12px;align-items:center;min-width:0}
.row > .grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:600;min-height:48px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.green{background:var(--green);border-color:var(--green);color:var(--bg)}
.btn.quiet{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.block{width:100%}

/* countdown */
.count{display:flex;gap:16px;align-items:center}
.count .big{font-family:var(--display);font-weight:700;font-size:4rem;line-height:.9;font-variant-numeric:tabular-nums;color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:.8125rem;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink)}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.acc{background:var(--accent);color:var(--accent-ink)}

/* today steps */
.step{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0;padding-top:0}
.step:last-of-type{padding-bottom:0}
.step .mark{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:700;flex:none}
.step.done .mark{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.step.done h3{color:var(--ink-2)}
.step .btn{min-height:44px;padding:8px 14px;flex:none}

.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--green);border-radius:99px}
.bar.two{position:relative}
.bar.two > b{position:absolute;inset:0 auto 0 0;background:var(--green);opacity:.35;border-radius:99px}
.bar.two > i{position:relative}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:14px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;min-width:0}
.list .item:first-child{border-top:0;padding-top:2px}
.list .item:last-child{padding-bottom:2px}
.item .grow{flex:1;min-width:0}
.item .chev{color:var(--ink-2);flex:none}
.tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:.75rem;font-weight:700}
.tick.on{background:var(--good-bg);border-color:var(--good);color:var(--good)}

/* lesson */
.lesson{display:flex;flex-direction:column;gap:14px}
.lesson p,.lesson li{max-width:65ch}
.lesson h2{margin-top:6px}
.lesson ul{padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.tip{background:var(--green-soft);border-radius:12px;padding:12px 14px}
.tip b.lbl{display:block;font-family:var(--display);letter-spacing:.08em;text-transform:uppercase;font-size:.8rem;color:var(--green)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9375rem}
th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:0;font-family:var(--display);letter-spacing:.06em;text-transform:uppercase;font-size:.8rem;color:var(--ink-2)}
figure.photo{border-radius:12px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
figure.photo img{display:block;width:100%;aspect-ratio:4/3;height:auto;max-height:340px;object-fit:contain;background:var(--surface-2)}
figure.photo figcaption{font-size:.8125rem;color:var(--ink-2);padding:6px 10px}

/* quiz */
.runbar{display:flex;align-items:center;gap:12px}
.runbar .bar{flex:1}
.runbar .x{border:0;background:none;font-weight:600;color:var(--ink-2);min-height:44px;padding:0 4px}
.qtext{font-family:var(--body);font-weight:600;font-size:1.2rem;line-height:1.35;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;min-height:54px;width:100%}
.opt .k{font-family:var(--display);font-weight:700;width:26px;height:26px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none;font-size:.95rem}
.opt .t{flex:1;min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--green);background:var(--green-soft)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default;opacity:1}
.fb{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--good-bg)} .fb.no{background:var(--bad-bg)}
.fb .v{font-family:var(--display);font-weight:700;font-size:1.25rem}
.fb.ok .v{color:var(--good)} .fb.no .v{color:var(--bad)}
.linkbtn{border:0;background:none;padding:6px 0;color:var(--ink-2);text-decoration:underline;font-size:.875rem;align-self:flex-start;min-height:36px}

/* exam */
.examnav{display:flex;gap:10px}
.examnav .btn{flex:1}
.grid60{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.grid60 button{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.8rem;font-variant-numeric:tabular-nums;padding:0}
.grid60 button.a{background:var(--green-soft);border-color:var(--green)}
.grid60 button.f{box-shadow:inset 0 0 0 2px var(--accent)}
.grid60 button.cur{outline:2px solid var(--ink);outline-offset:1px}
.grid60 button.ok{background:var(--good-bg);border-color:var(--good)} .grid60 button.no{background:var(--bad-bg);border-color:var(--bad)}
.scale{position:relative;height:14px;border-radius:99px;background:var(--surface-2);margin-top:22px}
.scale > i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--green)}
.scale > i.fail{background:var(--bad)}
.scale > s{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink)}
.scale > em{position:absolute;top:-24px;transform:translateX(-50%);font-style:normal;font-size:.75rem;color:var(--ink-2);white-space:nowrap}
.pnum{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:700;background:var(--surface-2);color:var(--ink-2);font-variant-numeric:tabular-nums}
.pnum.done{background:var(--good);color:var(--surface)}
.pnum.now{background:var(--accent);color:var(--accent-ink)}
.item .eyebrow{color:var(--vk)}
.nowcard{background:var(--vks);gap:8px}
.nowcard .eyebrow{color:var(--vk)}
textarea.code{font:.8rem/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;resize:vertical;word-break:break-all}
.fbimgs{display:grid;gap:8px;grid-template-columns:1fr;max-width:520px}
.fbimgs.two{grid-template-columns:1fr 1fr}
.fbimgs figure{margin:0;background:var(--surface);border-radius:10px;overflow:hidden;min-width:0}
.fbimgs img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--surface-2)}
.fbimgs.two img{aspect-ratio:1}
.fbimgs figcaption{padding:6px 8px;font-size:.78rem;line-height:1.3;display:flex;flex-direction:column;gap:2px;color:var(--ink)}
.fbimgs figcaption span{color:var(--ink-2)}

.linkcard{flex-direction:row;align-items:center;gap:14px}
.linkcard .lc-ic{width:44px;height:44px;border-radius:14px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;flex:none}
.linkcard .lc-ic svg{width:24px;height:24px}
.tipcard{align-items:flex-start}
.photocard .collage{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:6px;height:150px;margin:-4px -4px 0;border-radius:12px;overflow:hidden}
.photocard .collage img{width:100%;height:100%;object-fit:cover;display:block;background:var(--surface-2)}
.photocard .collage img:first-child{grid-row:1 / 3}
.exam-top{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.bigstat{display:flex;flex-direction:column;line-height:1}
.bigstat b{font-family:var(--display);font-size:2.6rem;color:var(--ink)}
.bigstat span{font-size:.75rem;color:var(--ink-2);margin-top:4px}
.vakbar{display:flex;gap:3px;height:12px;border-radius:99px;overflow:hidden}
.vakbar i{background:var(--vk)}
.vaklegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--ink-2)}
.vaklegend span{display:inline-flex;align-items:center;gap:6px}
.vaklegend i{width:10px;height:10px;border-radius:3px;background:var(--vk)}
.vaklegend b{color:var(--ink)}
.pts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pt{background:var(--surface-2);border-radius:12px;padding:8px;text-align:center;font-family:var(--display);font-weight:700;font-size:1.4rem;display:flex;flex-direction:column;line-height:1.1}
.pt small{font-family:var(--body);font-weight:500;font-size:.72rem;color:var(--ink-2)}
.pt.good{background:var(--good-bg);color:var(--good)} .pt.bad{background:var(--bad-bg);color:var(--bad)}
.hist{position:relative;height:120px;display:flex;align-items:flex-end;gap:6px;padding-top:16px;border-bottom:1px solid var(--line)}
.hist .hb{flex:1;max-width:34px;background:var(--bad-bg);border-radius:6px 6px 0 0;position:relative;min-width:0}
.hist .hb.ok{background:var(--good)}
.hist .hb em{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-style:normal;font-size:.65rem;color:var(--ink-2);white-space:nowrap}
.hist s{position:absolute;left:0;right:0;border-top:2px dashed var(--ink-2);opacity:.6;text-decoration:none}
.hist s em{position:absolute;right:0;top:-16px;font-style:normal;font-size:.65rem;color:var(--ink-2)}
.examq{display:flex;align-items:center;gap:12px}
.examq .qn{width:44px;height:44px;border-radius:14px;background:var(--vks);color:var(--vk);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.3rem;flex:none}
.examq .eyebrow{color:var(--vk);line-height:1.35}

.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;box-shadow:var(--shadow)}
.search svg{width:20px;height:20px;color:var(--ink-2);flex:none}
.search input{border:0;background:transparent;min-height:48px;padding:0;font:inherit;color:var(--ink);width:100%;min-width:0;outline:none}
.search:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.cursus{display:flex;flex-direction:column;gap:18px}
.toc{gap:8px}
.toc .eyebrow{margin-top:6px}
.toclist{display:flex;flex-direction:column}
.tocitem{border:0;background:none;text-align:left;padding:9px 0;display:flex;align-items:center;gap:10px;font-weight:600;border-top:1px solid var(--line);min-height:44px}
.toclist .tocitem:first-child{border-top:0}
.tocitem i{width:10px;height:10px;border-radius:3px;background:var(--vk,var(--green));flex:none}
.cetappe{font-size:1.7rem;margin-top:10px;padding-top:14px;border-top:3px solid var(--green)}
.cmod{display:flex;flex-direction:column;gap:14px}
.cmod > .lessonhead{background:var(--vks)}
.cmod > .eyebrow{color:var(--vk)}
.clesson{display:flex;flex-direction:column;gap:12px;padding-top:6px}
.clesson p,.clesson li{max-width:65ch}
.clesson ul{padding-left:1.2em;display:flex;flex-direction:column;gap:6px;margin:0}
.clesson h2{font-size:1.15rem}
.ltitle{font-family:var(--display);font-weight:700;font-size:1.45rem;line-height:1.15;color:var(--ink);padding-bottom:4px;border-bottom:2px solid var(--vk,var(--line))}
.atlas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.atlas figure{margin:0;background:var(--surface);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);min-width:0}
.atlas img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--surface-2)}
.atlas figcaption{padding:7px 9px;font-size:.8rem;line-height:1.3;display:flex;flex-direction:column;gap:2px}
.atlas figcaption span{color:var(--ink-2)}
nav.tabs button{font-size:.68rem}
.synccode{font-family:var(--display);font-weight:700;font-size:2rem;letter-spacing:.08em;text-align:center;padding:12px;border-radius:12px;background:var(--surface-2);user-select:all;transition:background .3s}
.synccode.copied{background:var(--good-bg);color:var(--good)}
.grank{display:flex;flex-direction:column}
.gr{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.grank .gr:first-child{border-top:0;padding-top:4px}
.gr .pos{font-family:var(--display);font-weight:700;font-size:1.3rem;color:var(--ink-2);text-align:center;line-height:1.2}
.gr.me .nm{color:var(--accent)}
.gr .nm{font-weight:600;overflow-wrap:anywhere}
.gmain{display:flex;flex-direction:column;gap:4px;min-width:0}
.gside{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.gside .xp{font-family:var(--display);font-weight:700;font-size:1.3rem}
.gside .flame{font-size:.95rem}
.gside .flame svg{width:18px;height:18px}
.botfab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:12px 16px;background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:0 8px 20px -6px rgba(0,0,0,.35)}
.botfab svg{width:22px;height:22px}
@media (min-width:900px){ .botfab{bottom:28px;right:32px} }
.bothead{display:flex;gap:14px;align-items:flex-start}
.botav{width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.botav svg{width:30px;height:30px}
.botlog{display:flex;flex-direction:column;gap:12px}
.bmsg{border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;max-width:100%;min-width:0}
.bmsg.bot{background:var(--surface);box-shadow:var(--shadow);border-top-left-radius:4px}
.bmsg.me{background:var(--green);color:var(--bg);align-self:flex-end;border-top-right-radius:4px;max-width:85%}
.bmsg ul{padding-left:1.2em;margin:0;display:flex;flex-direction:column;gap:4px}
.bpass{display:flex;flex-direction:column;gap:8px;padding-left:10px;border-left:3px solid var(--vk,var(--line))}
.bpass + .bpass{margin-top:6px}
.bsrc{font-size:.78rem;color:var(--ink-2)}
.bsrc .linkbtn{padding:0;min-height:0;font-size:.78rem;color:var(--vk,var(--green))}

    return p.then(function(t){ var o=JSON.parse(t); if(!o||typeof o!=='object'||typeof o.cards!=='object'||!o.cards) throw new Error('inhoud'); return norm(o); });
  }catch(e){ return Promise.reject(e); } }
